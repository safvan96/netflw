<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Flow — Электронный каталог | Промышленные средства измерения</title>
<meta name="description" content="Электронный каталог Net Flow: электромагнитные расходомеры, датчики уровня, преобразователи давления, датчики температуры, средства управления процессом и механического регулирования. Производство в Турции, калибровка с аккредитацией TÜRKAK.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
doc-page:not(:defined){visibility:hidden}
:root{
  --navy:#0A1628;--navy-2:#0E1D33;--navy-3:#13243F;--navy-line:#22374f;
  --blue:#1E88E5;--blue-6:#1976D2;--blue-7:#1565C0;--blue-3:#7CC0FF;--blue-4:#42A5F5;
  --gold:#F9A825;--green:#0a7a3f;
  --ink:#0A1628;--ink-2:#41566B;--ink-3:#6B7E92;
  --line:#E2E9F1;--line-2:#D3DEEA;--bg-alt:#F4F7FB;
  --f-head:"Plus Jakarta Sans",sans-serif;--f-body:"Inter",sans-serif;--f-mono:"JetBrains Mono",monospace;
}
*{box-sizing:border-box}
.page{font-family:var(--f-body);color:var(--ink);background:#fff;position:relative;overflow:hidden}
h1,h2,h3,h4,h5{font-family:var(--f-head);font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.1}
p{margin:0}
.blueprint{background-image:linear-gradient(rgba(124,192,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(124,192,255,.07) 1px,transparent 1px);background-size:34px 34px}

/* ---------- shared page chrome ---------- */
.pad{padding:13mm 13mm 16mm;display:flex;flex-direction:column}
.spec-t td{word-break:break-word}
.var p,.info-b p,.notes li{overflow-wrap:anywhere}
.ptop{display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--navy);padding-bottom:5mm;margin-bottom:7mm}
.plogo{display:flex;align-items:center;gap:3mm}
.plogo .nf-mark{width:8mm;height:8mm;display:block;object-fit:contain}
.plogo .nf-full{height:8mm;width:auto;display:block}
.plogo b{font-family:var(--f-head);font-weight:800;font-size:12pt;letter-spacing:-.02em;display:block;line-height:1}
.plogo small{font-family:var(--f-mono);font-size:5pt;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase;display:block;margin-top:.6mm}
.psec{font-family:var(--f-mono);font-size:6.6pt;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-7);font-weight:600;text-align:right}
.pfoot{position:absolute;left:14mm;right:14mm;bottom:7mm;display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-mono);font-size:6pt;color:var(--ink-3);letter-spacing:.06em;border-top:1px solid var(--line);padding-top:2.5mm}
.pno{font-weight:600;color:var(--navy)}

/* ---------- cover ---------- */
.cover{background:var(--navy);color:#fff}
.cover .bp{position:absolute;inset:0;opacity:.85}
.cover .glow{position:absolute;width:150mm;height:150mm;border-radius:50%;
  background:radial-gradient(circle,rgba(30,136,229,.34),transparent 62%);top:-45mm;right:-45mm}
.cov-in{position:relative;height:100%;padding:20mm 16mm 16mm;display:flex;flex-direction:column}
.cov-logo{display:flex;align-items:center;gap:4mm}
.cov-logo .nf-full{height:26mm;width:auto;display:block;filter:brightness(0) invert(1)}
.cov-mid{margin-top:auto}
.cov-eyebrow{font-family:var(--f-mono);font-size:7.4pt;letter-spacing:.24em;text-transform:uppercase;color:var(--blue-3);display:flex;align-items:center;gap:3mm}
.cov-eyebrow::before{content:"";width:14mm;height:1.2px;background:var(--blue-4)}
.cov-mid h1{font-size:40pt;line-height:1;margin-top:6mm;letter-spacing:-.035em;color:#fff}
.cov-mid h1 em{font-style:normal;color:var(--blue-3);display:block}
.cov-mid .lede{margin-top:7mm;font-size:11pt;line-height:1.6;color:#aebfd0;max-width:105mm}
.cov-cats{margin-top:9mm;display:grid;grid-template-columns:1fr 1fr;gap:2mm 6mm;max-width:120mm}
.cov-cats div{font-family:var(--f-mono);font-size:7.6pt;color:#cdd9e6;letter-spacing:.04em;display:flex;gap:2.5mm;align-items:center}
.cov-cats div::before{content:"";width:1.6mm;height:1.6mm;background:var(--blue-4);border-radius:50%;flex:none}
.cov-bot{margin-top:auto;padding-top:10mm;border-top:1px solid var(--navy-line);display:flex;justify-content:space-between;align-items:flex-end;gap:6mm}
.cov-badges{display:flex;gap:2.5mm;flex-wrap:wrap}
.bdg{font-family:var(--f-mono);font-size:6.2pt;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:1.8mm 3mm;border-radius:20mm;border:1px solid var(--navy-line);color:#cdd9e6;background:rgba(255,255,255,.05);white-space:nowrap}
.bdg.gold{border-color:rgba(249,168,37,.45);color:var(--gold);background:rgba(249,168,37,.12)}
.bdg.green{border-color:rgba(0,200,83,.4);color:#57e08f;background:rgba(0,200,83,.1)}
.cov-contact{font-family:var(--f-mono);font-size:7pt;color:#8ea1b5;line-height:1.8;text-align:right;white-space:nowrap}
.cov-contact b{color:#fff}
.cov-vfa{margin-top:5mm;font-family:var(--f-mono);font-size:6.6pt;letter-spacing:.1em;color:var(--blue-3);text-transform:uppercase}

/* ---------- contents ---------- */
.toc-grid{columns:3;column-gap:7mm;column-fill:balance;margin-top:3mm}
.toc-sec{margin:0 0 5mm;break-inside:auto}
.toc-sec h3{break-after:avoid}
.toc-sec h3{font-size:7.6pt;color:var(--navy);display:flex;align-items:baseline;gap:2mm;padding-bottom:1.4mm;border-bottom:1.2px solid var(--navy)}
.toc-sec h3 span{font-family:var(--f-mono);font-size:6pt;color:var(--blue-7);font-weight:600}
.toc-sec ul{list-style:none;padding:0;margin:1.8mm 0 0}
.toc-sec li{padding:0;border-bottom:1px dotted var(--line-2)}
.toc-sec li a{display:flex;justify-content:space-between;gap:2mm;font-size:6.2pt;color:var(--ink-2);padding:.7mm 0;text-decoration:none;align-items:baseline}
.toc-sec li a:hover{color:var(--blue-7)}
.toc-sec li b{font-weight:500;color:var(--ink);line-height:1.25}
.toc-sec li i{font-style:normal;font-family:var(--f-mono);font-size:5.4pt;color:var(--blue-7);flex:none}
.toc-hint{margin-top:5mm;font-family:var(--f-mono);font-size:6pt;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:2mm}
.toc-hint::before{content:"";width:8mm;height:1px;background:var(--blue-7)}
.page.jump-hit{outline:2px solid var(--blue-7);outline-offset:-2px}
.wa-a{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.wa-a:hover{color:var(--green)}
.wa-cta{margin-top:4mm}
.wa-btn{display:inline-flex;align-items:center;gap:2mm;background:#25D366;color:#fff;border:none;
  font-family:var(--f-head);font-weight:700;font-size:7.4pt;letter-spacing:.02em;
  padding:2.4mm 4.5mm;border-radius:99mm;text-decoration:none}
.wa-btn::before{content:"";width:3.4mm;height:3.4mm;border-radius:50%;background:#fff;flex:none}
@media print{.page.jump-hit{outline:none}.wa-a{border-bottom:none}
  a{text-decoration:none;color:inherit}}
@media print{.page.jump-hit{outline:none}}

/* ---------- working principle panel ---------- */
.wp{margin-top:5mm;border:1px solid var(--line);border-radius:2.5mm;overflow:hidden;break-inside:avoid}
.wp-h{background:var(--navy);color:#fff;padding:2.2mm 4mm;font-family:var(--f-mono);font-size:6.2pt;letter-spacing:.14em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.wp-h em{font-style:normal;color:var(--blue-3);letter-spacing:.06em}
.wp-b{display:grid;grid-template-columns:52mm 1fr;gap:5mm;padding:4mm;background:var(--bg-alt);align-items:center}
.wp-art{position:relative;height:34mm;border-radius:2mm;background:var(--navy);display:grid;place-items:center;overflow:hidden}
.wp-art .bp{position:absolute;inset:0;opacity:.55}
.wp-art svg{position:absolute;inset:0;width:100%;height:100%;padding:12%;box-sizing:border-box;color:var(--blue-3);overflow:visible}
.wp-steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:2.4mm}
.wp-steps li{display:flex;gap:2.6mm;align-items:flex-start;font-size:7pt;line-height:1.5;color:var(--ink-2)}
.wp-steps li i{font-style:normal;font-family:var(--f-mono);font-size:5.8pt;font-weight:600;color:#fff;background:var(--blue-7);width:4.2mm;height:4.2mm;border-radius:50%;display:grid;place-items:center;flex:none;margin-top:.3mm}
.wp-steps li b{color:var(--navy);font-weight:600}




/* ---------- about ---------- */
.ab-head{font-size:22pt;letter-spacing:-.03em;color:var(--navy)}
.ab-body{margin-top:5mm;columns:2;column-gap:8mm;font-size:8pt;line-height:1.66;color:var(--ink-2);text-align:justify}
.ab-body p{margin-bottom:3.5mm;orphans:3;widows:3}
.ab-stats{margin-top:7mm;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid var(--line);border-radius:2.5mm;overflow:hidden}
.ab-stats div{padding:4.5mm 4mm;border-right:1px solid var(--line);background:var(--bg-alt)}
.ab-stats div:last-child{border-right:none}
.ab-stats b{font-family:var(--f-mono);font-size:11pt;color:var(--navy);display:block;font-weight:600;letter-spacing:-.01em}
.ab-stats span{font-size:6.8pt;color:var(--ink-3);display:block;margin-top:1.5mm;line-height:1.4}

/* ---------- section divider ---------- */
.div-page{background:var(--navy);color:#fff}
.div-page .bp{position:absolute;inset:0;opacity:.8}
.div-page .glow{position:absolute;width:130mm;height:130mm;border-radius:50%;
  background:radial-gradient(circle,rgba(30,136,229,.3),transparent 62%);bottom:-40mm;left:-40mm}
.div-in{position:relative;height:100%;padding:16mm 16mm;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.div-kick{font-family:var(--f-mono);font-size:40pt;font-weight:600;color:rgba(124,192,255,.22);line-height:1;letter-spacing:-.04em}
.div-in h2{font-size:26pt;margin-top:3mm;letter-spacing:-.035em;color:#fff}
.div-in p{margin-top:4mm;font-size:9.5pt;color:#aebfd0;max-width:105mm;line-height:1.55}
.div-list{margin-top:6mm;display:grid;grid-template-columns:1fr 1fr;gap:1.8mm 7mm;max-width:135mm}
.div-list a{font-size:7.4pt;color:#cdd9e6;display:flex;gap:2.5mm;align-items:baseline;padding-bottom:1.5mm;border-bottom:1px solid rgba(255,255,255,.09);text-decoration:none}
.div-list a:hover{color:#fff;border-bottom-color:var(--blue-3)}
.div-list a i{font-style:normal;font-family:var(--f-mono);font-size:6.4pt;color:var(--blue-3);flex:none}
.div-hint{margin-top:5mm;font-family:var(--f-mono);font-size:6pt;letter-spacing:.1em;text-transform:uppercase;color:#7f93a8;display:flex;align-items:center;gap:2mm}
.div-hint::before{content:"";width:8mm;height:1px;background:var(--blue-3)}
.div-art{position:absolute;right:12mm;bottom:14mm;width:46mm;height:46mm;color:rgba(124,192,255,.3)}
.div-art svg{width:100%;height:100%}

/* ---------- product page ---------- */
.pr-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6mm}
.pr-title{flex:1;min-width:0}
.pr-code{font-family:var(--f-mono);font-size:7pt;font-weight:600;letter-spacing:.13em;color:var(--blue-7);text-transform:uppercase}
.pr-title h2{font-size:17pt;margin-top:2.5mm;letter-spacing:-.03em;color:var(--navy);line-height:1.06}
.pr-badges{display:flex;gap:2mm;flex-wrap:wrap;margin-top:3mm}
.pb{font-family:var(--f-mono);font-size:5.8pt;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:1.4mm 2.6mm;border-radius:20mm;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pb.turkey{background:rgba(249,168,37,.12);border-color:rgba(249,168,37,.4);color:#8a5e00}
.pb.cert{background:rgba(0,200,83,.09);border-color:rgba(0,200,83,.32);color:var(--green)}
.pb.blue{background:rgba(30,136,229,.09);border-color:rgba(30,136,229,.3);color:var(--blue-7)}
.pr-fig{width:58mm;height:46mm;flex:none;border-radius:2.5mm;background:var(--navy);position:relative;overflow:hidden;display:grid;place-items:center}
.pr-fig .bp{position:absolute;inset:0;opacity:.6}
.pr-fig .gl{position:relative;width:70%;height:70%;color:var(--blue-3)}
.pr-fig .gl svg{width:100%;height:100%;display:block;overflow:visible}
.pr-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:2mm;background:#fff}

.pr-desc{margin-top:5mm;font-size:8.1pt;line-height:1.6;color:var(--ink-2);text-align:justify;orphans:3;widows:3}
.pr-body{margin-top:5mm;display:grid;grid-template-columns:1fr 1fr;gap:7mm;align-items:start}
.blk-h{font-family:var(--f-mono);font-size:6.4pt;letter-spacing:.16em;text-transform:uppercase;color:var(--blue-7);font-weight:600;
  padding-bottom:1.8mm;border-bottom:1px solid var(--line-2);margin-bottom:3mm}
.spec-t{width:100%;border-collapse:collapse;font-size:7pt}
.spec-t td{padding:1.35mm 2mm;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.45}
.spec-t tr:nth-child(odd) td{background:var(--bg-alt)}
.spec-t td:first-child{color:var(--ink-3);width:40%;font-weight:500}
.spec-t td:last-child{font-family:var(--f-mono);color:var(--navy);font-size:6.7pt}
.var-list{display:flex;flex-direction:column;gap:2.2mm}
.var{padding:2.5mm 3mm;border-left:2px solid var(--blue);background:var(--bg-alt);border-radius:0 2mm 2mm 0;break-inside:avoid}
.var b{display:block;font-family:var(--f-head);font-size:8pt;color:var(--navy);font-weight:600}
.var p{margin-top:1.2mm;font-size:6.9pt;line-height:1.5;color:var(--ink-2)}
.info-row{margin-top:4.5mm;display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.info-b{break-inside:avoid}
.info-b p{font-size:7.2pt;line-height:1.55;color:var(--ink-2)}
.notes{margin-top:4.5mm;padding:3.5mm 4mm;background:var(--bg-alt);border-radius:2.5mm;border:1px solid var(--line);break-inside:avoid}
.pr-fill{margin-top:auto}
.pfoot-vfa{font-family:var(--f-mono);font-size:5.6pt;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}
.vstrip{margin-top:4mm}
.vgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:3mm;margin-top:3mm}
.vcard{border:1px solid var(--line);border-radius:2mm;background:#fff;overflow:hidden;break-inside:avoid}
.vcard .vph{position:relative;height:22mm;background:#fff;border-bottom:1px solid var(--line)}
.vcard .vph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:1.6mm;display:block}
.vcard b{display:block;font-family:var(--f-mono);font-size:5.6pt;letter-spacing:.04em;color:var(--navy);text-transform:uppercase;padding:1.6mm 1.8mm;text-align:center;line-height:1.3}
.notes ul{list-style:none;padding:0;margin:2.5mm 0 0;display:flex;flex-direction:column;gap:1.8mm}
.notes li{font-size:6.9pt;line-height:1.45;color:var(--ink-2);display:flex;gap:2.5mm;align-items:flex-start}
.notes li::before{content:"";width:1.4mm;height:1.4mm;border-radius:50%;background:var(--blue);flex:none;margin-top:1.3mm}

/* two products on one page */
.pr-half{padding-bottom:5mm;margin-bottom:5mm;border-bottom:1px dashed var(--line-2)}
.pr-half:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.pr-half .pr-title h2{font-size:14pt}
.pr-half .pr-fig{width:46mm;height:36mm}
.pr-half .pr-desc{margin-top:3.5mm;font-size:7.4pt;line-height:1.55}
.pr-half .pr-body{margin-top:4.5mm;gap:6mm}
.pr-half .spec-t{font-size:6.5pt}
.pr-half .spec-t td{padding:1.1mm 1.8mm}
.pr-half .spec-t td:last-child{font-size:6.3pt}

.cont-label{font-family:var(--f-mono);font-size:6.2pt;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4mm}
/* ---------- closing ---------- */
.cl-body{margin-top:6mm;color:var(--ink-2);text-align:justify}
.cl-items{margin-top:7mm;display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.cl-item{padding:4.5mm;border:1px solid var(--line);border-radius:2.5mm;background:var(--bg-alt);break-inside:avoid}
.cl-item b{display:block;font-family:var(--f-head);font-size:9pt;color:var(--navy)}
.cl-item p{margin-top:2mm;font-size:7.4pt;line-height:1.55;color:var(--ink-2)}

/* ---------- back cover ---------- */
.back{background:var(--navy);color:#fff}
.back .bp{position:absolute;inset:0;opacity:.8}
.back .glow{position:absolute;width:140mm;height:140mm;border-radius:50%;
  background:radial-gradient(circle,rgba(30,136,229,.3),transparent 62%);top:-40mm;left:-40mm}
.back-in{position:relative;height:100%;padding:20mm 16mm 16mm;display:flex;flex-direction:column}
.back-in h2{font-size:26pt;letter-spacing:-.03em;color:#fff;margin-top:8mm}
.back-in .sub{margin-top:5mm;font-size:10pt;color:#aebfd0;max-width:100mm;line-height:1.6}
.back-grid{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8mm;padding-top:12mm}
.back-col h5{font-family:var(--f-mono);font-size:6.4pt;letter-spacing:.18em;text-transform:uppercase;color:#6f859b;margin-bottom:3.5mm}
.back-col p{font-size:9pt;line-height:1.85;color:#cdd9e6}
.back-col p b{color:#fff;font-family:var(--f-mono)}
.back-bot{margin-top:12mm;padding-top:5mm;border-top:1px solid var(--navy-line);display:flex;justify-content:space-between;align-items:center;gap:5mm;flex-wrap:wrap}
.back-bot span{font-family:var(--f-mono);font-size:6.2pt;color:#7f93a8;letter-spacing:.05em}

/* ---------- continuous fit scale (driven per page by the fit pass) ----------
   --fill  : full range, WHITESPACE only (padding, gaps, margins)
   --tfill : type scale, tightly clamped so body copy stays near-constant
   --gfill : graphics scale, narrow so photos stay near-constant            */
.page{--fill:1;--tfill:1;--gfill:1}
/* whitespace absorbs the slack */
.spec-t td{padding:calc(1.5mm * var(--fill)) calc(2.4mm * var(--fill))}
.wp{margin-top:calc(5mm * var(--fill))}
.wp-b{padding:calc(4mm * var(--fill));gap:calc(5mm * var(--fill))}
.wp-steps{gap:calc(2.4mm * var(--fill))}
.vstrip{margin-top:calc(4mm * var(--fill))}
.vgrid{gap:calc(3mm * var(--fill))}
.notes{margin-top:calc(4.5mm * var(--fill));padding:calc(3.5mm * var(--fill)) calc(4mm * var(--fill));break-inside:auto}
.notes li{break-inside:avoid;orphans:2;widows:2}
.info-row{gap:calc(6mm * var(--fill))}
.ab-stats{gap:calc(5mm * var(--fill));margin-top:calc(7mm * var(--fill))}
.cl-items{gap:calc(4mm * var(--fill));margin-top:calc(5mm * var(--fill))}
.blk-h{margin-bottom:calc(2.6mm * var(--fill))}
.ab-body p,.cl-body p{margin-bottom:calc(3.6mm * var(--fill))}
/* graphics: near-constant */
.pr-fig{width:calc(52mm * var(--gfill));height:calc(41mm * var(--gfill))}
.pr-half .pr-fig{width:calc(42mm * var(--gfill));height:calc(33mm * var(--gfill))}
.wp-art{height:calc(30mm * var(--gfill))}
.vcard .vph{height:calc(20mm * var(--gfill))}
/* type: near-constant document-wide */
.pr-desc{font-size:calc(8.1pt * var(--tfill));line-height:1.7}
.wp-steps li{font-size:calc(7pt * var(--tfill));line-height:1.75}
.notes li{font-size:calc(6.9pt * var(--tfill));line-height:1.6}
.notes p{font-size:calc(7.6pt * var(--tfill));line-height:1.7}
.info-b p{font-size:calc(7.4pt * var(--tfill));line-height:1.7}
.ab-head{font-size:calc(22pt * var(--tfill))}
.ab-body p,.cl-body p{font-size:calc(8.6pt * var(--tfill));line-height:1.8}
.ab-stats b{font-size:calc(15pt * var(--tfill))}

/* contents page scales with the fit pass */
.toc-grid{column-gap:calc(7mm * var(--fill))}
.toc-sec{margin-bottom:calc(5mm * var(--fill))}
.toc-sec h3{font-size:calc(7.6pt * var(--fill));padding-bottom:calc(1.4mm * var(--fill))}
.toc-sec h3 span{font-size:calc(6pt * var(--fill))}
.toc-sec ul{margin-top:calc(1.8mm * var(--fill))}
.toc-sec li a{font-size:calc(6.2pt * var(--fill));padding:calc(.7mm * var(--fill)) 0}
.toc-sec li i{font-size:calc(5.4pt * var(--fill))}
.toc-hint{margin-top:calc(5mm * var(--fill));font-size:calc(6pt * var(--fill))}

/* headings and badges scale with body copy so the hierarchy stays coherent */
.wp-h{font-size:calc(6.2pt * var(--fill));padding:calc(2.2mm * var(--fill)) calc(4mm * var(--fill))}
.wp-h em{font-size:calc(6.2pt * var(--fill))}
.blk-h{font-size:calc(6.4pt * var(--fill))}
.wp-steps li i{width:calc(4.2mm * var(--fill));height:calc(4.2mm * var(--fill));font-size:calc(5.8pt * var(--fill))}

/* ---------- catalog language switcher (screen only) ---------- */
.nf-lang{position:fixed;top:14px;right:14px;z-index:9999;display:flex;gap:6px;padding:6px;
  background:rgba(10,22,40,.9);border:1px solid var(--navy-line);border-radius:99mm;backdrop-filter:blur(8px)}
.nf-lang a{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:#9fb1c4;
  text-decoration:none;padding:6px 11px;border-radius:99mm;line-height:1;transition:.15s;direction:ltr}
.nf-lang a:hover{color:#fff;background:rgba(255,255,255,.1)}
.nf-lang a.on{background:var(--blue);color:#fff}
@media print{.nf-lang{display:none!important}}
/* short continuation pages: centre the tail so the slack reads as margin */
.pr-body{align-items:start}
.pr-body > *{align-self:start}
</style>
